name: Release Charts
on:
  workflow_run:
    workflows:
      - lint
    branches: main
    types: completed
jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: Run chart-releaser
        uses: jouve/chart-releaser-action@8e87a9d9bbe7c5029fe24bb75b05ff55ab887479
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and sign charts
        run: |
          set -euo pipefail
          test -d .cr-release-packages || { echo '.cr-release-packages does not exist'; exit 0; }
          repo="ghcr.io/${{ github.repository }}"
          for pkg in .cr-release-packages/*.tgz; do
            chart=$(helm show chart "$pkg" | sed -n 's/^name: //p')
            digest=$(helm push "$pkg" "oci://${repo}" 2>&1 | tee /dev/stderr | sed -n 's/^Digest: //p')
            cosign sign --yes "${repo}/${chart}@${digest}"
          done
