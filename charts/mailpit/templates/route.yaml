{{- if .Values.route.http.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}-http
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.http.parentRefs }}
  parentRefs: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
  {{- end }}
  {{- with .Values.route.http.hostnames }}
  hostnames: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Values.service.http.name | default ( printf "%s-http" (include "common.names.fullname" .)) }}
          port: {{ .Values.service.http.port }}
      {{- with .Values.route.http.matches }}
      matches: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 8 }}
      {{- end }}
      {{- with .Values.route.http.filters }}
      filters: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 8 }}
      {{- end }}
      {{- with .Values.route.http.timeouts }}
      timeouts: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 8 }}
      {{- end }}
{{- end }}
